name: Build Windows installer

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Engine self-test (synthetic HEC-RAS case)
        run: python -m tests.test_engine

      - name: Build application
        run: |
          python packaging/make_assets.py
          pyinstaller --noconfirm --clean packaging/HECRAS_SUFI2.spec

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: HECRAS-SUFI2-Setup
          path: dist/installer/*.exe

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*.exe
